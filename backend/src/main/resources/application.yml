server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: prime-mobile-inventory
  profiles:
    active: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/primemobile_db}
    username: ${SPRING_DATASOURCE_USERNAME:primemobile}
    password: ${SPRING_DATASOURCE_PASSWORD:prime_secret_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  jwt:
    secret: ${APP_JWT_SECRET:prime_mobile_super_secret_jwt_key_must_be_256_bits_long_min_security_key_2026}
    expiration-ms: 86400000 # 24 hours
  parser:
    url: ${APP_PARSER_SERVICE_URL:http://localhost:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    hu.primemobile: DEBUG
    org.springframework.security: INFO
