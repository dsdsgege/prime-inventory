    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  parser-service:
    ports:
      - "${PARSER_PORT:-5000}:5000"

  backend:
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    ports:
      - "${FRONTEND_PORT:-80}:80"
